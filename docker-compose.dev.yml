version: "3.9"
services:
  adenzo:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: adenzo_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  nginx:
    image: nginx:alpine
    container_name: adenzo_nginx
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - adenzo
