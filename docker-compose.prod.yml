version: "3.9"
services:
  adenzo:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: adenzo_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production

  nginx:
    image: nginx:alpine
    container_name: adenzo_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - adenzo
